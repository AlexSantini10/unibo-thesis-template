name: Build and release PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-extra texlive-lang-italian biber

      - name: Compile thesis
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verify generated PDF
        run: test -s main.pdf

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: main.pdf

      - name: Create version identifiers
        id: version
        env:
          TZ: Europe/Rome
        run: |
          echo "tag=versione-$(date '+%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"
          echo "title=Versione del $(date '+%d/%m/%Y alle %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" main.pdf \
            --title "${{ steps.version.outputs.title }}" \
            --notes "PDF compilato automaticamente dal commit ${{ github.sha }}."

      - name: Clean generated files
        run: latexmk -C main.tex
